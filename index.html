<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tanışma Sayacı</title>
<style>
  :root{
    --cream: #f3ecdf;
    --gold: #d9a25c;
    --muted: #7a7a7a;
    --line: #ffffff1a;
  }

  * { box-sizing: border-box; }
  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #000;
    position: relative;
  }

  body{
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    color: var(--cream);
  }

  /* ---- Stage: everything lives in here so we can rotate the whole page ---- */
  #stage{
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  /* Forced-landscape hack: rotates the whole stage 90deg for phones stuck
     in portrait / with rotation lock on, so the layout always renders wide. */
  #stage.force-landscape{
    width: 100vh;
    height: 100vw;
    position: absolute;
    top: 0;
    left: 100%;
    transform-origin: top left;
    transform: rotate(90deg);
  }

  #bgVideo{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;
    pointer-events: none;
  }

  .video-overlay{
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: -1;
    pointer-events: none;
  }

  .stage-inner{
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px 30px;
  }

  /* ---- Landscape card: text left, clocks right ---- */
  .card{
    width: 100%;
    max-width: 780px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 40px;
    padding: 26px 40px;
    border-radius: 22px;
    border: 1px solid var(--line);
  }

  .card-left{
    text-align: left;
    min-width: 0;
  }

  .eyebrow{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0.4px;
    color: var(--muted);
    margin: 0 0 6px;
  }

  h1{
    font-size: 22px;
    font-weight: 500;
    margin: 0 0 14px;
    color: var(--cream);
  }

  .duration-line{
    font-size: 17px;
    line-height: 1.5;
    color: var(--gold);
    margin: 0;
    text-align: left;
  }

  .tiny-note{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 0.3px;
    color: var(--muted);
    vertical-align: middle;
    margin-left: 2px;
  }

  .clocks-row{
    display: flex;
    gap: 26px;
    flex-shrink: 0;
  }

  .clock-block{
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .clock{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-variant-numeric: tabular-nums;
    font-size: 28px;
    font-weight: 200;
    letter-spacing: 1px;
    color: var(--cream);
    margin: 0 0 4px;
  }

  .clock-label{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 9px;
    letter-spacing: 1.6px;
    color: var(--muted);
    margin: 0;
  }

  /* very short landscape (small phones) */
  @media (max-height: 400px){
    .card{ padding: 16px 28px; gap: 26px; }
    h1{ font-size: 18px; margin-bottom: 8px; }
    .duration-line{ font-size: 14px; }
    .clock{ font-size: 22px; }
    .clocks-row{ gap: 18px; }
  }

  @media (max-height: 320px){
    .card{ padding: 12px 22px; gap: 18px; }
    h1{ font-size: 15px; margin-bottom: 6px; }
    .duration-line{ font-size: 12px; }
    .clock{ font-size: 18px; }
  }

  /* ---- Shared overlay styling (rotate prompt + sound tutorial) ---- */
  .overlay{
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    background: rgba(0, 0, 0, 0.55);
    opacity: 1;
    transition: opacity 0.5s ease;
  }

  .overlay.hidden{
    opacity: 0;
    pointer-events: none;
  }

  .rotate-icon{
    width: 52px;
    height: 52px;
    opacity: 0.9;
    animation: rotateHint 1.6s ease-in-out infinite;
  }

  .rotate-icon svg{
    width: 100%;
    height: 100%;
    stroke: var(--cream);
    fill: none;
    stroke-width: 1.4;
  }

  @keyframes rotateHint{
    0%   { transform: rotate(0deg); }
    50%  { transform: rotate(90deg); }
    100% { transform: rotate(90deg); }
  }

  .overlay-text{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px;
    letter-spacing: 0.4px;
    color: var(--cream);
    opacity: 0.9;
    text-align: center;
    max-width: 260px;
  }

  .rotate-btn{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px;
    letter-spacing: 0.5px;
    color: #000;
    background: var(--gold);
    border: none;
    border-radius: 999px;
    padding: 12px 26px;
    cursor: pointer;
  }

  .tap-icon{
    width: 48px;
    height: 48px;
    opacity: 0.85;
    animation: tapPulse 1.1s ease-in-out infinite;
  }

  .tap-icon svg{
    width: 100%;
    height: 100%;
    stroke: var(--cream);
    fill: none;
    stroke-width: 1.4;
  }

  @keyframes tapPulse{
    0%   { transform: scale(1);    opacity: 0.55; }
    50%  { transform: scale(1.18); opacity: 0.95; }
    100% { transform: scale(1);    opacity: 0.55; }
  }
</style>
</head>
<body>

<div id="stage">

  <video
    id="bgVideo"
    autoplay
    muted
    loop
    playsinline
    disablepictureinpicture
    disableremoteplayback
  >
    <source src="https://www.image2url.com/r2/default/videos/1788606104170-c81166f4-7a92-4096-b5c6-f3db693b3549.mp4" type="video/mp4">
  </video>
  <div class="video-overlay"></div>

  <div class="stage-inner">
    <div class="card">
      <div class="card-left">
        <p class="eyebrow">tanıştığımızdan bu yana</p>
        <h1>Geçen Zaman</h1>
        <p class="duration-line" id="durationLine">hesaplanıyor…</p>
      </div>

      <div class="clocks-row">
        <div class="clock-block">
          <div class="clock" id="clockAZ">00:00:00</div>
          <p class="clock-label">AZERBAYCAN</p>
        </div>
        <div class="clock-block">
          <div class="clock" id="clockTR">00:00:00</div>
          <p class="clock-label">TÜRKİYE</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Portrait / rotation-locked cihazlar için -->
  <div id="rotateOverlay" class="overlay">
    <div class="rotate-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="3" width="8" height="14" rx="1.5"/>
        <path d="M19 9a7 7 0 0 1-2 6.6M19 9l2.3-1M19 9l-1 2.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <p class="overlay-text">daha iyi bir görünüm için ekranı yatay çevir</p>
    <button id="rotateBtn" class="rotate-btn">yatay çevir</button>
  </div>

  <!-- Sesi açmak için tek dokunuş -->
  <div id="soundTutorial" class="overlay" style="display:none;">
    <div class="tap-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 11.5V5.5a1.5 1.5 0 0 1 3 0v5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M12 10.5V4a1.5 1.5 0 0 1 3 0v6.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15 10.8V6a1.5 1.5 0 0 1 3 0v9" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M6 12.5V9a1.5 1.5 0 0 1 3-.3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M6 12.5c0 4.4 2.5 8 6.5 8s6.5-3.1 6.5-6.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <p class="overlay-text">sesi açmak için ekrana dokun</p>
  </div>

</div>

<script>
  const bgVideo = document.getElementById('bgVideo');
  bgVideo.play().catch(() => {});

  // ---- Video "canlı" senkronizasyon: hiç durmayan bir yayın gibi ----
  // Videonun süresine göre şu anki gerçek zamandan (Unix zaman damgası) hesap
  // yapıp videoyu doğru saniyeye atlatıyoruz. Böylece sayfayı kim, ne zaman
  // açarsa açsın video hep aynı "canlı" andan oynuyormuş gibi görünüyor —
  // sayfa her açıldığında baştan başlamıyor.
  function syncBgVideoToLiveTime(force){
    const duration = bgVideo.duration;
    if (!duration || isNaN(duration) || duration <= 0) return;
    const nowSec = Date.now() / 1000;
    let target = nowSec % duration;
    if (target < 0) target += duration;
    const diff = Math.abs(bgVideo.currentTime - target);
    // Küçük farkları görmezden gel (akışı kesmesin), sadece belirgin
    // sapmalarda ya da zorlandığında (force) senkronize et.
    if (force || diff > 0.5) {
      bgVideo.currentTime = target;
    }
  }

  bgVideo.addEventListener('loadedmetadata', () => syncBgVideoToLiveTime(true));
  // Video döngüye her girdiğinde (loop) de tazeleyelim, süre yuvarlama
  // hatalarından kaynaklanan küçük kaymalar birikmesin.
  bgVideo.addEventListener('seeked', () => {});
  bgVideo.addEventListener('ended', () => syncBgVideoToLiveTime(true));
  setInterval(() => syncBgVideoToLiveTime(false), 5000);

  // ↓↓↓ TANIŞTIĞINIZ GERÇEK TARİH VE SAATİ BURAYA YAZ ↓↓↓
  const START_DATE = new Date(2026, 6, 28, 12, 40, 0);
  // ↑↑↑ Sadece bu satırı değiştir, gerisi otomatik ↑↑↑

  const durationLine = document.getElementById('durationLine');
  const clockAZ = document.getElementById('clockAZ');
  const clockTR = document.getElementById('clockTR');

  function pad(n){ return String(n).padStart(2, '0'); }

  function getPartsInTZ(date, timeZone){
    const fmt = new Intl.DateTimeFormat('en-US', {
      timeZone,
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      hour12: false
    });
    const parts = {};
    fmt.formatToParts(date).forEach(p => { if (p.type !== 'literal') parts[p.type] = parseInt(p.value, 10); });
    if (parts.hour === 24) parts.hour = 0;
    return parts;
  }

  function clockStringInTZ(date, timeZone){
    const p = getPartsInTZ(date, timeZone);
    return `${pad(p.hour)}:${pad(p.minute)}:${pad(p.second)}`;
  }

  function update(){
    const now = new Date();

    clockAZ.textContent = clockStringInTZ(now, 'Asia/Baku');
    clockTR.textContent = clockStringInTZ(now, 'Europe/Istanbul');

    const startP = getPartsInTZ(START_DATE, 'Asia/Baku');
    const nowP = getPartsInTZ(now, 'Asia/Baku');

    let years = nowP.year - startP.year;
    let months = nowP.month - startP.month;
    let days = nowP.day - startP.day;

    if (days < 0) {
      months -= 1;
      const prevMonthLastDay = new Date(Date.UTC(nowP.year, nowP.month - 1, 0)).getUTCDate();
      days += prevMonthLastDay;
    }
    if (months < 0) {
      years -= 1;
      months += 12;
    }

    const yearPart = `${years} yıl${years === 0 ? '<span class="tiny-note">daha çok var</span>' : ''}`;
    const monthPart = `${months} ay${months === 0 ? '<span class="tiny-note">daha çok var</span>' : ''}`;
    const dayPart = `${days} gün`;

    durationLine.innerHTML = `${yearPart} ${monthPart} ${dayPart}`;
  }

  update();
  setInterval(update, 1000);

  // ---- Yatay zorlama (rotate hack) + ses açma ----
  const stage = document.getElementById('stage');
  const rotateOverlay = document.getElementById('rotateOverlay');
  const rotateBtn = document.getElementById('rotateBtn');
  const soundTutorial = document.getElementById('soundTutorial');

  let forced = false;
  let soundEnabled = false;

  function isPortrait(){
    return window.matchMedia('(orientation: portrait)').matches;
  }

  function enableSound(){
    if (soundEnabled) return;
    soundEnabled = true;
    bgVideo.muted = false;
    bgVideo.play().catch(() => {});
    hideOverlay(soundTutorial);
  }

  function hideOverlay(el){
    if (!el) return;
    el.classList.add('hidden');
    setTimeout(() => { el.style.display = 'none'; }, 500);
  }

  async function forceLandscape(){
    forced = true;
    // CSS döndürme hack'ini HEMEN, senkron olarak uyguluyoruz — video'nun
    // donanım hızlandırmalı katmanı sayfa daha yeni başlarken bu düzene
    // göre kuruluyor. Bunu geciktirmek (fullscreen sonrasına atmak) videoyu
    // siyah gösteren bir donanım katmanı hatasına yol açıyor.
    stage.classList.add('force-landscape');
    hideOverlay(rotateOverlay);
    // Bu tıklama gerçek bir kullanıcı etkileşimi olduğu için sesi de burada açıyoruz
    enableSound();

    // Tam ekrana geç (adres çubuğu / durum çubuğu gizlenir)
    try{
      const el = document.documentElement;
      const requestFS = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
      if (requestFS) {
        await requestFS.call(el);
      }
    }catch(e){ /* fullscreen reddedilirse sessizce devam, CSS hack zaten yatay gösteriyor */ }

    // NOT: screen.orientation.lock() bilerek kullanılmıyor — bazı cihazlarda
    // gerçekten çalışıp CSS hack'iyle çakışıyor ve yazılar tekrar dikey
    // görünüyordu (çift döndürme). Tek ve güvenilir yöntem olarak CSS
    // hack'te sabit kalıyoruz.

    // Video'yu tam ekran geçişinden sonra garanti altına al
    setTimeout(forcePlayVideo, 150);
  }

  // Tam ekran geçişleri sırasında video duraklatılmışsa yeniden başlat
  document.addEventListener('fullscreenchange', () => {
    forcePlayVideo();
  });

  function refreshOverlays(){
    if (forced) return; // kullanıcı zaten yatay çevir'e bastıysa müdahale etme
    if (isPortrait()) {
      rotateOverlay.style.display = 'flex';
      rotateOverlay.classList.remove('hidden');
      soundTutorial.style.display = 'none';
    } else {
      rotateOverlay.style.display = 'none';
      if (!soundEnabled) {
        soundTutorial.style.display = 'flex';
        soundTutorial.classList.remove('hidden');
      }
    }
  }

  refreshOverlays();
  window.addEventListener('resize', refreshOverlays);
  window.addEventListener('orientationchange', refreshOverlays);

  rotateBtn.addEventListener('click', forceLandscape);
  soundTutorial.addEventListener('click', enableSound);
  document.addEventListener('touchstart', () => { if (soundTutorial.style.display !== 'none') enableSound(); }, { once: false });

  function forcePlayVideo(){
    if (bgVideo && bgVideo.paused) {
      bgVideo.play().catch(() => {});
    }
  }
  forcePlayVideo();

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      bgVideo.pause();
    } else {
      syncBgVideoToLiveTime(true);
      bgVideo.play().catch(() => {});
    }
  });

  // ---- Tik-tak sesi (saat efekti) ----
  let audioCtx = null;
  let tickToggle = false;

  function ensureAudio(){
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  document.addEventListener('click', ensureAudio, { once: true });
  document.addEventListener('touchstart', ensureAudio, { once: true });

  function playTick(){
    if (!audioCtx || audioCtx.state !== 'running') return;
    if (document.hidden) return;

    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'square';
    osc.frequency.value = tickToggle ? 1000 : 800;
    tickToggle = !tickToggle;

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.15, now + 0.002);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.045);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.05);
  }

  setInterval(playTick, 1000);

  document.addEventListener('visibilitychange', () => {
    if (!audioCtx) return;
    if (document.hidden) {
      audioCtx.suspend();
    } else {
      audioCtx.resume();
    }
  });
</script>

</body>
</html>
