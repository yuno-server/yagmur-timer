<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tanışma Sayacı</title>
<style>
  :root{
    --cream: #f3ecdf;
    --gold: #d9a25c;
    --muted: #7a7a7a;
    --line: #ffffff1a;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body{
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    background: #000;
    color: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    overflow: hidden;
  }

  #bgVideo{
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;
    pointer-events: none;
  }

  .video-overlay{
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: -1;
    pointer-events: none;
  }

  .card{
    width: 100%;
    max-width: 440px;
    padding: 44px 34px 38px;
    border-radius: 22px;
    border: 1px solid var(--line);
    text-align: center;
  }

  .eyebrow{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px;
    letter-spacing: 0.4px;
    color: var(--muted);
    margin: 0 0 6px;
  }

  h1{
    font-size: 26px;
    font-weight: 500;
    margin: 0 0 30px;
    color: var(--cream);
  }

  .duration-line{
    font-size: 21px;
    line-height: 1.5;
    color: var(--gold);
    margin: 0 0 26px;
    min-height: 32px;
  }

  .tiny-note{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 0.3px;
    color: var(--muted);
    vertical-align: middle;
    margin-left: 2px;
  }

  .clock{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-variant-numeric: tabular-nums;
    font-size: 40px;
    font-weight: 200;
    letter-spacing: 1px;
    color: var(--cream);
    margin: 0 0 4px;
  }

  .clocks-row{
    display: flex;
    justify-content: center;
    gap: 34px;
    margin: 0 0 4px;
  }

  .clock-block{
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .clock-label{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    margin: 0;
  }

  @media (max-width: 480px){
    .clock{ font-size: 30px; }
    .clocks-row{ gap: 20px; }
    .duration-line{ font-size: 18px; }
  }

  /* ---- Tıkla tutorial overlay ---- */
  #clickTutorial{
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    background: rgba(0, 0, 0, 0.35);
    opacity: 1;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }

  #clickTutorial.hidden{
    opacity: 0;
  }

  .tap-icon{
    width: 56px;
    height: 56px;
    opacity: 0.85;
    animation: tapPulse 1.1s ease-in-out infinite;
  }

  .tap-icon svg{
    width: 100%;
    height: 100%;
    stroke: var(--cream);
    fill: none;
    stroke-width: 1.4;
  }

  .tap-text{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px;
    letter-spacing: 0.5px;
    color: var(--cream);
    opacity: 0.85;
    text-align: center;
  }

  @keyframes tapPulse{
    0%   { transform: scale(1);    opacity: 0.55; }
    50%  { transform: scale(1.18); opacity: 0.95; }
    100% { transform: scale(1);    opacity: 0.55; }
  }
</style>
</head>
<body>

<video
  id="bgVideo"
  autoplay
  muted
  loop
  playsinline
  disablepictureinpicture
  disableremoteplayback
>
  <source src="https://raw.githubusercontent.com/yunopm5-design/PATTES-video/main/dans%20eden%20kedi%20yung%20ouzo%20-%20on%20numara%20edit(MP4).mp4" type="video/mp4">
</video>
<div class="video-overlay"></div>

<audio
  id="bgMusic"
  loop
  playsinline
  preload="auto"
  crossorigin="anonymous"
>
  <source src="https://raw.githubusercontent.com/yunopm5-design/PATTES-video/main/Dolu%20Kadehi%20Ters%20Tut%20-%20Dilerim%20Ki%20(Live%20_Assos)(MP3_320K).mp3" type="audio/mpeg">
</audio>

<div id="clickTutorial">
  <div class="tap-icon">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M9 11.5V5.5a1.5 1.5 0 0 1 3 0v5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12 10.5V4a1.5 1.5 0 0 1 3 0v6.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M15 10.8V6a1.5 1.5 0 0 1 3 0v9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M6 12.5V9a1.5 1.5 0 0 1 3-.3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M6 12.5c0 4.4 2.5 8 6.5 8s6.5-3.1 6.5-6.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <p class="tap-text">sesi açmak için ekrana dokun</p>
</div>

<div class="card">
  <p class="eyebrow">tanıştığımızdan bu yana</p>
  <h1>Geçen Zaman</h1>

  <p class="duration-line" id="durationLine">hesaplanıyor…</p>

  <div class="clocks-row">
    <div class="clock-block">
      <div class="clock" id="clockAZ">00:00:00</div>
      <p class="clock-label">AZERBAYCAN SAATI</p>
    </div>
    <div class="clock-block">
      <div class="clock" id="clockTR">00:00:00</div>
      <p class="clock-label">TÜRKİYE SAATİ</p>
    </div>
  </div>
</div>

<script>
  // ↓↓↓ TANIŞTIĞINIZ GERÇEK TARİH VE SAATİ BURAYA YAZ ↓↓↓
  // Format: new Date(YIL, AY-1, GÜN, SAAT, DAKİKA, SANİYE)
  // Örnek: 23 Ağustos 2026, saat 15:47:10 için:
  const START_DATE = new Date(2026, 6, 28, 12, 40, 0);
  // ↑↑↑ Sadece bu satırı değiştir, gerisi otomatik ↑↑↑

  const durationLine = document.getElementById('durationLine');
  const clockAZ = document.getElementById('clockAZ');
  const clockTR = document.getElementById('clockTR');

  function pad(n){ return String(n).padStart(2, '0'); }

  // Bir anı, verilen saat dilimindeki takvim alanlarına çevirir (yıl, ay, gün, saat, dk, sn)
  function getPartsInTZ(date, timeZone){
    const fmt = new Intl.DateTimeFormat('en-US', {
      timeZone,
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      hour12: false
    });
    const parts = {};
    fmt.formatToParts(date).forEach(p => { if (p.type !== 'literal') parts[p.type] = parseInt(p.value, 10); });
    // Bazı tarayıcılar gece yarısını 24 olarak verebiliyor, 0'a çeviriyoruz
    if (parts.hour === 24) parts.hour = 0;
    return parts;
  }

  function clockStringInTZ(date, timeZone){
    const p = getPartsInTZ(date, timeZone);
    return `${pad(p.hour)}:${pad(p.minute)}:${pad(p.second)}`;
  }

  function update(){
    const now = new Date();

    // İki canlı dünya saati
    clockAZ.textContent = clockStringInTZ(now, 'Asia/Baku');
    clockTR.textContent = clockStringInTZ(now, 'Europe/Istanbul');

    // Gün/ay/yıl sayacı Azərbaycan tarihine göre hesaplanır
    const startP = getPartsInTZ(START_DATE, 'Asia/Baku');
    const nowP = getPartsInTZ(now, 'Asia/Baku');

    let years = nowP.year - startP.year;
    let months = nowP.month - startP.month;
    let days = nowP.day - startP.day;

    if (days < 0) {
      months -= 1;
      const prevMonthLastDay = new Date(Date.UTC(nowP.year, nowP.month - 1, 0)).getUTCDate();
      days += prevMonthLastDay;
    }
    if (months < 0) {
      years -= 1;
      months += 12;
    }

    const yearPart = `${years} yıl${years === 0 ? '<span class="tiny-note">daha çok var</span>' : ''}`;
    const monthPart = `${months} ay${months === 0 ? '<span class="tiny-note">daha çok var</span>' : ''}`;
    const dayPart = `${days} gün`;

    durationLine.innerHTML = `${yearPart} ${monthPart} ${dayPart}`;
  }

  update();
  setInterval(update, 1000);

  // ---- "Sesi açmak için dokun" tutorial overlay'i ----
  const clickTutorial = document.getElementById('clickTutorial');
  let tutorialHidden = false;

  function hideTutorial(){
    if (tutorialHidden || !clickTutorial) return;
    tutorialHidden = true;
    clickTutorial.classList.add('hidden');
    setTimeout(() => {
      clickTutorial.style.display = 'none';
    }, 600); // transition süresi kadar bekle
  }

  // Kullanıcı tıklarsa/dokunursa hemen kaybolsun
  document.addEventListener('click', hideTutorial, { once: true });
  document.addEventListener('touchstart', hideTutorial, { once: true });

  // Tıklamasa bile 3.5 saniye sonra otomatik kaybolsun
  setTimeout(hideTutorial, 3500);

  // ---- Arka plan videosu ----
  const bgVideo = document.getElementById('bgVideo');
  function forcePlayVideo(){
    if (bgVideo && bgVideo.paused) {
      bgVideo.play().catch(() => {});
    }
  }
  forcePlayVideo();
  document.addEventListener('click', forcePlayVideo, { once: true });
  document.addEventListener('touchstart', forcePlayVideo, { once: true });

  // ---- Arka plan müziği ----
  const bgMusic = document.getElementById('bgMusic');
  let musicStarted = false;

  function startMusic(){
    if (!bgMusic || musicStarted || document.hidden) return;
    bgMusic.play()
      .then(() => { musicStarted = true; })
      .catch((err) => {
        console.warn('Müzik başlatılamadı, sonraki etkileşimde tekrar denenecek:', err);
      });
  }

  document.addEventListener('click', startMusic);
  document.addEventListener('touchstart', startMusic);

  // Sekme/uygulama arka plana alınınca müzik dursun, öne gelince devam etsin
  document.addEventListener('visibilitychange', () => {
    if (!bgMusic) return;
    if (document.hidden) {
      bgMusic.pause();
    } else if (musicStarted) {
      bgMusic.play().catch(() => {});
    }
  });

  // ---- Tik-tak sesi ----
  let audioCtx = null;
  let tickToggle = false;

  function ensureAudio(){
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  // Tarayıcılar sesi ancak bir kullanıcı etkileşiminden sonra izin veriyor
  document.addEventListener('click', ensureAudio, { once: true });
  document.addEventListener('touchstart', ensureAudio, { once: true });

  function playTick(){
    if (!audioCtx || audioCtx.state !== 'running') return;
    if (document.hidden) return;

    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'square';
    osc.frequency.value = tickToggle ? 1000 : 800;
    tickToggle = !tickToggle;

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.15, now + 0.002);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.045);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.05);
  }

  setInterval(playTick, 1000);

  // Sekme arka plana alınınca ses tamamen dursun
  document.addEventListener('visibilitychange', () => {
    if (!audioCtx) return;
    if (document.hidden) {
      audioCtx.suspend();
    } else {
      audioCtx.resume();
    }
  });
</script>

</body>
</html>
